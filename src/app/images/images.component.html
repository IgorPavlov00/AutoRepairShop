<section class="process" id="proces">
  <div class="container">
    <header class="process__head" appReveal>
      <div>
        <span class="eyebrow">Proces</span>
        <h2 class="display h2">Kako funkcioniše</h2>
      </div>
      <p>Jednostavno zakažite usluge auto-limarskog servisa i uživajte u profesionalnim rešenjima.</p>
    </header>

    <ol class="steps">
      <li *ngFor="let step of steps; let i = index" class="step" appReveal>
        <span class="step__number" aria-hidden="true">{{ i + 1 }}</span>
        <h3 class="step__title">{{ step.title }}</h3>
        <p>{{ step.text }}</p>
      </li>
    </ol>
  </div>
</section>
