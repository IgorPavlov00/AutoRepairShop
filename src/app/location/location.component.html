<section class="contact" id="kontakt">
  <div class="container">
    <header class="contact__head" appReveal>
      <span class="eyebrow">Kontakt</span>
      <h2 class="display h2">Kontaktirajte nas već danas!</h2>
      <p>Opišite šta treba da se popravi, a mi vam odgovaramo ponudom na email.</p>
    </header>

    <div class="contact__grid">
      <form class="form" (ngSubmit)="submitForm()" novalidate appReveal>
        <div class="field">
          <label for="name">Ime</label>
          <input id="name" name="name" type="text" autocomplete="given-name" maxlength="80"
                 [(ngModel)]="formData.name" [attr.aria-invalid]="!!errors['name']" [attr.aria-describedby]="errors['name'] ? 'name-error' : null">
          <small *ngIf="errors['name']" id="name-error">{{ errors['name'] }}</small>
        </div>
        <div class="field">
          <label for="lastname">Prezime</label>
          <input id="lastname" name="lastname" type="text" autocomplete="family-name" maxlength="80"
                 [(ngModel)]="formData.lastname" [attr.aria-invalid]="!!errors['lastname']" [attr.aria-describedby]="errors['lastname'] ? 'lastname-error' : null">
          <small *ngIf="errors['lastname']" id="lastname-error">{{ errors['lastname'] }}</small>
        </div>
        <div class="field field--full">
          <label for="email">Vaš email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="160"
                 [(ngModel)]="formData.email" [attr.aria-invalid]="!!errors['email']" [attr.aria-describedby]="errors['email'] ? 'email-error' : null">
          <small *ngIf="errors['email']" id="email-error">{{ errors['email'] }}</small>
        </div>
        <div class="field field--full">
          <label for="message">Šta treba da se popravi?</label>
          <textarea id="message" name="message" rows="5" maxlength="4000"
                    [(ngModel)]="formData.message" [attr.aria-invalid]="!!errors['message']" [attr.aria-describedby]="errors['message'] ? 'message-error' : null"></textarea>
          <small *ngIf="errors['message']" id="message-error">{{ errors['message'] }}</small>
        </div>

        <!-- Honeypot for bots, hidden from people and assistive technology. -->
        <div class="form__trap" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" [(ngModel)]="formData.website">
        </div>

        <div class="form__footer field--full">
          <button class="btn" type="submit" [disabled]="status === 'sending'">
            {{ status === 'sending' ? 'Šaljemo…' : 'Pošalji upit' }}
          </button>
          <p class="form__status" role="status"
             [class.is-error]="status === 'error'" [class.is-success]="status === 'success'">
            <ng-container *ngIf="status === 'success'">Hvala! Vaša poruka je poslata.</ng-container>
            <ng-container *ngIf="status === 'error'">Poruka nije poslata. Pokušajte ponovo malo kasnije.</ng-container>
          </p>
        </div>
      </form>

      <div class="map" appReveal>
        <iframe title="Lokacija radionice Radonić na Google mapi" loading="lazy" allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d11236.324454811322!2d19.801025!3d45.2461525!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x475b11ff1fc3e0e1%3A0x1323802f45f16a0!2sAutolimarska%20Radionica%20Radoni%C4%87!5e0!3m2!1sen!2srs!4v1695111751031!5m2!1sen!2srs"></iframe>
      </div>
    </div>
  </div>
</section>
