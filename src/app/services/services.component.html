<section class="services" id="usluge">
  <div class="container">
    <header class="services__head" appReveal>
      <span class="eyebrow">Usluge</span>
      <h2 class="display h2">Usluge koje nudimo</h2>
    </header>

    <ul class="services__grid">
      <li *ngFor="let service of services; let i = index" class="service" appReveal
          [class.service--large]="i < 2" [class.service--wide]="i === services.length - 1">
        <div class="service__media">
          <img [src]="'assets/images/' + service.image + '.webp'" [alt]="service.alt" loading="lazy" width="900" height="600">
        </div>
        <div class="service__body">
          <h3 class="service__title">{{ service.title }}</h3>
          <p>{{ service.text }}</p>
        </div>
      </li>
    </ul>
  </div>
</section>
